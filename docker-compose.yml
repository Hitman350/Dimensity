services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dimensity
      POSTGRES_USER: dimensity
      POSTGRES_PASSWORD: localdevonly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimensity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dimensity:localdevonly@db:5432/dimensity
      NODE_ENV: development

volumes:
  pgdata:
